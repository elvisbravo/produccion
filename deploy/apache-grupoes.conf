# /etc/apache2/sites-available/grupoes.conf
# Reemplaza produccion.tudominio.com por tu subdominio. El contenedor "web" escucha en 127.0.0.1:8080.
#
# Módulos necesarios (una sola vez):
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
# Activar:
#   sudo a2ensite grupoes && sudo apachectl configtest && sudo systemctl reload apache2
# HTTPS (certbot copia este sitio al puerto 443 y agrega el certificado):
#   sudo certbot --apache -d produccion.tudominio.com
<VirtualHost *:80>
    ServerName produccion.tudominio.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Notificaciones en tiempo real (Socket.IO): las conexiones WebSocket van por ws://
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/api/(.*)$ ws://127.0.0.1:8080/api/$1 [P,L]

    # Todo lo demás (la web y la API)
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    ProxyTimeout 120

    ErrorLog ${APACHE_LOG_DIR}/grupoes-error.log
    CustomLog ${APACHE_LOG_DIR}/grupoes-access.log combined
</VirtualHost>
