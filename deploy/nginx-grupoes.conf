# /etc/nginx/sites-available/grupoes  (luego: ln -s a sites-enabled y certbot --nginx)
# Reemplaza produccion.tudominio.com por tu dominio.
server {
    listen 80;
    server_name produccion.tudominio.com;

    # La web (archivos estáticos de apps/web/dist)
    root /srv/grupoes/produccion/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los archivos con hash en el nombre se pueden guardar mucho tiempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # La API y el canal de notificaciones en tiempo real (Socket.IO usa WebSocket)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cualquier otra ruta es de la aplicación (el enrutador de la web la resuelve)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
