<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Producción · GRUPO ES</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo (ver src/components/tema.tsx).
      try {
        var t = localStorage.getItem('ges-tema')
        var oscuro = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', oscuro)
        document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
