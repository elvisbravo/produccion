<script id="md" type="text/markdown"># Modelo de datos — Sistema de Producción

Base de datos: **PostgreSQL 16**. Migraciones con **Prisma Migrate**.

## Convenciones

- Tablas y columnas en `snake_case`, nombres en singular.
- Llave primaria `id` de tipo `uuid` (UUID v7, ordenable por fecha). Las tablas puente usan una llave compuesta.
- Los registros que ve el usuario tienen un **código legible**: `P-2026-0001` (prospecto), `T-2026-0001` (trabajo), `C-2026-0001` (cotización), `R-2026-0001` (recibo).
- **Columnas de auditoría** en todas las tablas principales (se omiten en los diagramas): `creado_en`, `creado_por`, `actualizado_en`, `actualizado_por`, `eliminado_en` (eliminación lógica).
- Montos en `numeric(12,2)`; fechas con hora en `timestamptz` (zona `America/Lima`).
- Los `enum` se listan en el comentario del campo.
- **UK** = único. En las tablas con eliminación lógica, al eliminar un registro se **libera** su valor único renombrándolo (p. ej. `email` → `email#eliminado-<id>`), para que pueda volver a registrarse. Se evita el índice único parcial porque Prisma Migrate no lo soporta.

## 1. Usuarios, roles y permisos

```mermaid
erDiagram
    usuario {
        uuid id PK
        varchar nombres
        varchar apellidos
        varchar email UK
        varchar celular
        date fecha_nacimiento "cumpleaños = día libre"
        text password_hash
        bool activo
        int intentos_fallidos
        timestamptz bloqueado_hasta
        timestamptz ultimo_acceso
    }
    rol {
        uuid id PK
        varchar codigo UK "ADMIN, ASIST_ADM, AUXILIAR, ASIST_PROD, JEFE_PROD..."
        varchar nombre
        text descripcion
        bool es_sistema "no se puede eliminar"
        bool activo
    }
    usuario_rol {
        uuid usuario_id PK, FK
        uuid rol_id PK, FK
    }
    modulo {
        uuid id PK
        varchar codigo UK "prospectos, tareas, produccion..."
        varchar nombre
        uuid padre_id FK "submódulos"
        varchar ruta
        varchar icono
        int orden
        bool activo
    }
    accion {
        uuid id PK
        uuid modulo_id FK
        varchar codigo "ver, crear, editar, eliminar, imprimir, convertir..."
        varchar nombre
        bool usa_alcance
        bool vigente "false si ya no existe en el código"
    }
    rol_permiso {
        uuid rol_id PK, FK
        uuid accion_id PK, FK
        enum alcance "propios / equipo / todos"
    }
    usuario_permiso {
        uuid id PK
        uuid usuario_id FK
        uuid accion_id FK
        enum tipo "conceder / denegar"
        enum alcance "propios / equipo / todos"
        text motivo
        uuid otorgado_por FK
        timestamptz fecha
    }
    sesion {
        uuid id PK
        uuid usuario_id FK
        varchar token_hash UK "SHA-256 del refresh token"
        timestamptz expira_en
        timestamptz revocada_en
        varchar ip
        varchar dispositivo
        timestamptz creada_en
        timestamptz ultimo_uso
    }
    acceso_log {
        uuid id PK
        uuid usuario_id FK "null si el correo no existe"
        varchar email_intento
        timestamptz fecha
        varchar ip
        varchar dispositivo
        enum resultado "exito / fallo / bloqueado"
    }
    auditoria {
        uuid id PK
        uuid usuario_id FK
        varchar accion "crear / editar / eliminar..."
        varchar entidad
        uuid entidad_id
        jsonb antes
        jsonb despues
        varchar ip
        timestamptz fecha
    }

    usuario ||--o{ usuario_rol : ""
    rol ||--o{ usuario_rol : ""
    modulo ||--o{ modulo : "submódulos"
    modulo ||--o{ accion : "define"
    rol ||--o{ rol_permiso : ""
    accion ||--o{ rol_permiso : ""
    usuario ||--o{ usuario_permiso : "excepciones"
    accion ||--o{ usuario_permiso : ""
    usuario ||--o{ sesion : "refresh tokens"
    usuario ||--o{ acceso_log : ""
    usuario ||--o{ auditoria : ""
```

> **Sesiones:** el access token (JWT, 15 min) no se guarda. El refresh token (7 días) viaja en una cookie httpOnly y en `sesion` solo se guarda su hash. Cada uso lo **rota**; si un token ya rotado se reutiliza, se revocan todas las sesiones del usuario.

## Ajustes hechos al implementar

Diferencias entre el diseño de arriba y lo que ya está en `apps/api/prisma/schema.prisma` (el esquema de Prisma es la fuente de verdad):

| Tabla | Cambio | Motivo |
|---|---|---|
| `sesion` | Nueva; con `motivo_revocacion` (rotada / logout / reutilizacion) | Refresh tokens rotativos y margen para pestañas simultáneas |
| `correlativo` | Nueva: `serie`, `anio`, `ultimo` | Códigos legibles (P-2026-0001) sin repetir, con incremento atómico |
| `tipo_trabajo`, `nivel_academico`, `origen_contacto`, `motivo_perdida` | + `orden` | Orden de las listas en los formularios |
| `prioridad_trabajo` | + `por_defecto` | Valor inicial en el formulario (Media) |
| `origen_contacto` | + `es_referido` | Solo el origen "Referido" pide "referido por" |
| `etapa_prospecto` | + `inicial`; el `evento automático` se agrega con el módulo de tareas | Etapa en la que nace todo prospecto |
| `prospecto` | `prioridad_id`, `origen_id`, `captado_por_id` (nombres cortos); `fecha_cotizacion` | Consistencia de nombres |
| `prospecto_contacto` | + `orden` | Mantener el orden de los contactos |
| `prospecto_evento` | + `datos` (jsonb); tipos: creado, editado, cambio_etapa, nota, contacto, reasignado | Línea de tiempo |
| `persona` | `CHECK`: tipo y número de documento van juntos; único por (tipo, número) | Integridad del documento |
| `accion` | + `vigente` | Acciones que ya no existen en el código no se borran |
| `acceso_log` | + `email_intento` | Registrar intentos con correos inexistentes |
| — | Extensión `unaccent` y función `f_unaccent()` | Búsqueda sin distinguir tildes ni mayúsculas |
| `actividad` | + `orden`; nombre único | Orden en los formularios |
| `actividad_participacion` | + `orden`; único por (actividad, nombre) | Orden y referencia estable |
| `prioridad_rol` | `nivel` único | 1 = principal, 2 = secundaria, 3 = respaldo |
| `tarea` | `fecha` (día en Lima) + `inicio` opcional (timestamptz); + `notas`, `completada_en`, `motivo_cancelacion`, `veces_reprogramada`; por ahora solo `prospecto_id` (el `trabajo_id` y `entregable_id` llegan con el módulo de trabajos) | Tareas con o sin hora fija |
| `tarea_responsable` | Sin campos de cola todavía (`orden_cola`, inicio/fin planificados, holgura, modalidad): llegan con la programación de producción | Alcance de esta etapa |
| `prospecto_evento` | + tipo `tarea` | Programación, asignación, reprogramación y cancelación en la línea de tiempo |
| `etapa_prospecto` | `CHECK`: actividad y momento del evento automático van juntos | Integridad del embudo |
| — | `registro_tiempo` aún no se crea | Llega con la agenda y el cronómetro |
| `trabajo` | `prospecto_id` único (un prospecto se convierte una sola vez); datos académicos copiados del prospecto | El trabajo evoluciona sin tocar el prospecto |
| `trabajo_equipo` | `desde` / `hasta` en lugar de borrar; índice único parcial: un solo auxiliar principal y un solo jefe vigentes | Historial de cambios de equipo |
| `trabajo_evento` | Nueva: línea de tiempo del trabajo (creado, equipo, pago, anulación…) | Igual que `prospecto_evento` |
| `contrato` | Sin código propio (se usa el del trabajo); uno por trabajo; `fin_garantia` se calcula al entregar | Menos códigos que recordar |
| `cuota` | `CHECK` monto > 0; único por (contrato, número); la suma debe igualar el total (se valida en la API) | Cuotas libres |
| `pago` | + `numero_recibo` (R-AAAA-NNNN); anulación lógica (`anulado_en`, `anulado_por_id`, `motivo_anulacion`); anular es solo del administrador por defecto | No se borran pagos |
| `pago_cuota` | Nueva: cuánto de cada pago se aplicó a cada cuota (primero la más antigua) | Pagos parciales y adelantados |
| `plantilla_horario_tramo`, `horario_usuario_tramo` | `minuto_inicio` / `minuto_fin` (smallint, minutos desde las 00:00) en lugar de `time`; `CHECK` de día 1–7 y fin > inicio | Cálculos de disponibilidad sin conversiones de zona horaria |
| `plantilla_horario` | + `por_defecto` (única, índice parcial); sin `activa` en la UI todavía | Quien no tiene horario propio usa la plantilla por defecto |
| `horario_usuario` | Sin `vigente_hasta`: rige hasta el siguiente `vigente_desde` (único por usuario y fecha) | Evita rangos que se crucen |
| `ausencia` | `fecha_desde` / `fecha_hasta` (date) + `minuto_desde` / `minuto_hasta` solo en permisos por horas de un día; estado + `anulada`; `resuelta_por` / `resuelta_en` / `observacion` en lugar de `aprobada_por`; sin sustento adjunto todavía | Días completos y permisos por horas con `CHECK` |
| `feriado` | `medio_dia` = se trabaja solo la mañana (hasta las 13:00) | Regla fija por ahora |
